<title>Pushups</title>
<style>
  :root {
    --bg: #0f172a;
    --bg2: #111c33;
    --card: #1e293b;
    --line: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-ink: #082f49;
    --good: #22c55e;
    --stamp: #ef4444;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  body.done {
    --bg: #052e16;
    --bg2: #064e3b;
    --card: #14532d;
    --line: #166534;
    --muted: #a7f3d0;
    --accent: #4ade80;
    --accent-ink: #052e16;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-color: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overscroll-behavior: none;
    transition: background-color .9s var(--ease), color .9s var(--ease);
  }
  .app {
    min-height: 100%;
    max-width: 480px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 18px);
    display: flex; flex-direction: column; gap: 18px;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .date { font-size: 15px; color: var(--muted); transition: color .9s; }
  .title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 20px; line-height: 1;
    display: grid; place-items: center; transition: background-color .9s, border-color .9s;
  }
  .ring-wrap { position: relative; width: min(74vw, 300px); aspect-ratio: 1; margin: 4px auto 0; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { stroke: var(--card); transition: stroke .9s; }
  .ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease), stroke .9s; }
  .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .count { font-size: clamp(64px, 22vw, 92px); font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .count.bump { animation: bump .35s var(--ease); }
  @keyframes bump { 40% { transform: scale(1.12); } }
  .of { color: var(--muted); font-size: 15px; margin-top: 6px; transition: color .9s; }
  .togo { text-align: center; font-weight: 600; font-size: 17px; min-height: 24px; margin-top: -6px; }
  .adds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .add {
    border: 0; border-radius: 20px; padding: 22px 0;
    background: var(--accent); color: var(--accent-ink);
    font: inherit; font-size: 28px; font-weight: 800; letter-spacing: -.02em;
    transition: transform .08s, background-color .9s, color .9s;
  }
  .add:active { transform: scale(.94); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ghost {
    border: 1px solid var(--line); border-radius: 16px; padding: 14px 0;
    background: var(--card); color: var(--text); font: inherit; font-weight: 600;
    transition: transform .08s, background-color .9s, border-color .9s, opacity .2s;
  }
  .ghost:active { transform: scale(.96); }
  .ghost:disabled { opacity: .4; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; text-align: center; transition: background-color .9s, border-color .9s; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); transition: color .9s; }
  .week { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px 10px; transition: background-color .9s, border-color .9s; }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 84px; }
  .bar { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .bar i { display: block; width: 100%; max-width: 26px; border-radius: 6px 6px 3px 3px; background: var(--line); min-height: 4px; transition: height .5s var(--ease), background-color .9s; }
  .bar.hit i { background: var(--good); }
  .bar.today i { outline: 2px solid var(--text); outline-offset: 1px; }
  .labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 6px; text-align: center; font-size: 11px; color: var(--muted); }
  .labels small { display: block; font-size: 10px; opacity: .8; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }

  /* Celebration */
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
  .stamp-layer { position: fixed; inset: 0; display: none; place-items: center; z-index: 30; background: rgba(0,0,0,.35); }
  .stamp-layer.show { display: grid; animation: fadeIn .2s ease-out; }
  .stamp-layer.hide { animation: fadeOut .4s ease-in forwards; }
  .stamp {
    border: 7px solid var(--stamp); color: var(--stamp); border-radius: 14px;
    padding: 14px 26px 10px; text-align: center; transform: rotate(-12deg);
    font-weight: 900; text-transform: uppercase; letter-spacing: .06em;
    background: rgba(255,255,255,.04);
    mix-blend-mode: screen;
    box-shadow: inset 0 0 0 3px rgba(239,68,68,.35);
    animation: stampIn .45s cubic-bezier(.3,1.6,.5,1) both;
  }
  .stamp .big { font-size: 64px; line-height: 1; }
  .stamp .small { font-size: 16px; margin-top: 6px; letter-spacing: .2em; }
  @keyframes stampIn { 0% { transform: rotate(-12deg) scale(3.2); opacity: 0; } 70% { opacity: 1; } 100% { transform: rotate(-12deg) scale(1); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }
  .shake { animation: shake .4s; }
  @keyframes shake { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, 0); } }

  /* Settings sheet */
  .sheet-layer { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-end; justify-content: center; z-index: 40; }
  .sheet-layer.show { display: flex; }
  .sheet {
    width: 100%; max-width: 480px; background: #0b1222; color: #f8fafc; border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px); display: grid; gap: 10px;
    animation: up .25s var(--ease);
  }
  @keyframes up { from { transform: translateY(100%); } }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; }
  .sheet p { margin: 0 0 6px; color: #94a3b8; font-size: 13px; }
  .sheet button { border: 1px solid #334155; background: #1e293b; color: #f8fafc; border-radius: 14px; padding: 14px; font: inherit; font-weight: 600; text-align: left; }
  .sheet button.danger { color: #fca5a5; }
  .sheet button.close { text-align: center; background: transparent; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); background: #f8fafc; color: #0f172a; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 50; white-space: nowrap; }
  .toast.show { opacity: 1; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div>
      <div class="date" id="date"></div>
      <h1 class="title">Pushups</h1>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Settings">&#8943;</button>
  </header>

  <div class="ring-wrap" aria-live="polite">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="11"/>
      <circle class="ring-fg" id="ring" cx="60" cy="60" r="52" fill="none" stroke-width="11"/>
    </svg>
    <div class="ring-center">
      <div class="count" id="count">0</div>
      <div class="of" id="of">of 100</div>
    </div>
  </div>
  <div class="togo" id="togo"></div>

  <div class="adds">
    <button class="add" data-n="25">+25</button>
    <button class="add" data-n="20">+20</button>
    <button class="add" data-n="10">+10</button>
  </div>
  <div class="row">
    <button class="ghost" id="undoBtn">Undo</button>
    <button class="ghost" id="customBtn">Other amount</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="streak">0</b><span>day streak</span></div>
    <div class="stat"><b id="week">0</b><span>this week</span></div>
    <div class="stat"><b id="best">0</b><span>best day</span></div>
  </div>

  <div class="week">
    <div class="bars" id="bars"></div>
    <div class="labels" id="labels"></div>
  </div>
  <div class="spacer"></div>
</div>

<canvas id="confetti"></canvas>
<div class="stamp-layer" id="stampLayer">
  <div class="stamp" id="stamp">
    <div class="big" id="stampBig">100</div>
    <div class="small" id="stampSmall">Done for today</div>
  </div>
</div>

<div class="sheet-layer" id="sheetLayer">
  <div class="sheet" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <p>Your data stays on this phone. Back it up before moving the app to a new address, since each address keeps its own data.</p>
    <button id="goalBtn">Daily goal: <span id="goalLabel">100</span></button>
    <button id="exportBtn">Back up data</button>
    <button id="importBtn">Restore from backup</button>
    <button id="resetTodayBtn" class="danger">Clear today</button>
    <button id="closeBtn" class="close">Close</button>
    <input type="file" id="importFile" accept="application/json,.json,text/plain">
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var KEY = "pushups.v1";
  var CIRC = 2 * Math.PI * 52;
  var DAY_LETTERS = ["S", "M", "T", "W", "T", "F", "S"];

  // ---------- storage ----------
  function blank() { return { goal: 100, days: {} }; }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return blank();
      var d = JSON.parse(raw);
      if (!d || typeof d !== "object" || typeof d.days !== "object") return blank();
      if (!(d.goal > 0)) d.goal = 100;
      return d;
    } catch (e) { return blank(); }
  }
  var memoryOnly = false;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { if (!memoryOnly) { memoryOnly = true; toast("Can't save on this device"); } }
  }
  var state = load();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  // ---------- dates (local time) ----------
  function keyFor(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  var todayKey = keyFor(new Date());

  function log(k) { return state.days[k] || []; }
  function total(k) { var s = 0, l = log(k); for (var i = 0; i < l.length; i++) s += l[i]; return s; }

  function streak() {
    var now = new Date(), n = 0;
    var d = total(keyFor(now)) >= state.goal ? now : addDays(now, -1); // today counts once done
    while (total(keyFor(d)) >= state.goal) { n++; d = addDays(d, -1); }
    return n;
  }
  function weekTotal() {
    var now = new Date(), s = 0;
    var start = addDays(now, -((now.getDay() + 6) % 7)); // Monday
    for (var d = start; d <= now; d = addDays(d, 1)) s += total(keyFor(d));
    return s;
  }
  function best() {
    var b = 0;
    for (var k in state.days) { var t = total(k); if (t > b) b = t; }
    return b;
  }

  // ---------- elements ----------
  function $(id) { return document.getElementById(id); }
  var countEl = $("count"), ringEl = $("ring"), togoEl = $("togo"), undoBtn = $("undoBtn");
  ringEl.style.strokeDasharray = CIRC;
  ringEl.style.strokeDashoffset = CIRC;

  // ---------- render ----------
  function render() {
    var now = new Date();
    var c = total(todayKey), g = state.goal;
    $("date").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    countEl.textContent = c;
    $("of").textContent = "of " + g;
    ringEl.style.strokeDashoffset = CIRC * (1 - Math.min(c / g, 1));
    togoEl.textContent = c >= g ? (c > g ? "Goal hit, +" + (c - g) + " bonus" : "Goal hit") : (g - c) + " to go";
    document.body.classList.toggle("done", c >= g);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", c >= g ? "#052e16" : "#0f172a");
    undoBtn.disabled = log(todayKey).length === 0;
    $("streak").textContent = streak();
    $("week").textContent = weekTotal();
    $("best").textContent = best();
    $("goalLabel").textContent = g;

    var bars = "", labels = "", max = g;
    for (var i = 6; i >= 0; i--) { var t0 = total(keyFor(addDays(now, -i))); if (t0 > max) max = t0; }
    for (var j = 6; j >= 0; j--) {
      var d = addDays(now, -j), k = keyFor(d), t = total(k);
      var cls = "bar" + (t >= g ? " hit" : "") + (j === 0 ? " today" : "");
      bars += '<div class="' + cls + '"><i style="height:' + Math.max(4, Math.round((t / max) * 100)) + '%"></i></div>';
      labels += "<div>" + DAY_LETTERS[d.getDay()] + "<small>" + (t || "") + "</small></div>";
    }
    $("bars").innerHTML = bars;
    $("labels").innerHTML = labels;
  }

  // ---------- actions ----------
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  function add(n) {
    n = Math.round(n);
    if (!(n > 0) || n > 1000) return;
    var before = total(todayKey);
    (state.days[todayKey] = log(todayKey).slice()).push(n);
    save();
    buzz(12);
    countEl.classList.remove("bump"); void countEl.offsetWidth; countEl.classList.add("bump");
    render();
    if (before < state.goal && before + n >= state.goal) celebrate();
  }

  function undo() {
    var l = log(todayKey).slice();
    if (!l.length) return;
    var n = l.pop();
    if (l.length) state.days[todayKey] = l; else delete state.days[todayKey];
    save(); buzz(8); render();
    toast("Removed " + n);
  }

  // ---------- celebration ----------
  var canvas = $("confetti"), ctx = canvas.getContext && canvas.getContext("2d");
  var parts = [], raf = 0;
  var COLORS = ["#22c55e", "#4ade80", "#facc15", "#38bdf8", "#f472b6", "#f8fafc", "#fb923c"];
  function confetti() {
    if (!ctx) return;
    var dpr = window.devicePixelRatio || 1, w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    parts = [];
    for (var i = 0; i < 180; i++) {
      var fromLeft = i % 2 === 0;
      parts.push({
        x: fromLeft ? -10 : w + 10, y: h * (0.55 + Math.random() * 0.3),
        vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 7), vy: -(9 + Math.random() * 9),
        s: 5 + Math.random() * 6, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
        c: COLORS[i % COLORS.length], life: 0
      });
    }
    var start = performance.now();
    cancelAnimationFrame(raf);
    (function frame(t) {
      var el = t - start;
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, 1 - el / 4200);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore();
      }
      if (el < 4200) raf = requestAnimationFrame(frame); else ctx.clearRect(0, 0, w, h);
    })(start);
  }
  var stampTimer = 0;
  function stamp() {
    var layer = $("stampLayer");
    $("stampBig").textContent = state.goal;
    layer.classList.remove("hide"); layer.classList.add("show");
    var s = $("stamp"); s.style.animation = "none"; void s.offsetWidth; s.style.animation = "";
    setTimeout(function () { $("app").classList.add("shake"); setTimeout(function () { $("app").classList.remove("shake"); }, 450); }, 330);
    clearTimeout(stampTimer);
    stampTimer = setTimeout(hideStamp, 2600);
  }
  function hideStamp() {
    var layer = $("stampLayer");
    if (!layer.classList.contains("show")) return;
    layer.classList.add("hide");
    setTimeout(function () { layer.classList.remove("show", "hide"); }, 400);
  }
  function celebrate() {
    buzz([60, 40, 60, 40, 180]);
    stamp();
    confetti();
  }
  $("stampLayer").addEventListener("click", hideStamp);

  // ---------- settings ----------
  var toastTimer = 0;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }
  function openSheet() { $("sheetLayer").classList.add("show"); }
  function closeSheet() { $("sheetLayer").classList.remove("show"); }
  $("menuBtn").addEventListener("click", openSheet);
  $("closeBtn").addEventListener("click", closeSheet);
  $("sheetLayer").addEventListener("click", function (e) { if (e.target === this) closeSheet(); });

  $("goalBtn").addEventListener("click", function () {
    var v = prompt("Daily goal", state.goal);
    if (v === null) return;
    v = parseInt(v, 10);
    if (v > 0 && v <= 10000) { state.goal = v; save(); render(); toast("Goal set to " + v); }
  });
  $("customBtn").addEventListener("click", function () {
    var v = prompt("How many pushups?", "");
    if (v === null || v === "") return;
    var n = parseInt(v, 10);
    if (n > 0 && n <= 1000) add(n); else toast("Enter a number from 1 to 1000");
  });
  $("resetTodayBtn").addEventListener("click", function () {
    if (!confirm("Clear today's pushups?")) return;
    delete state.days[todayKey]; save(); render(); closeSheet();
  });
  $("exportBtn").addEventListener("click", function () {
    var json = JSON.stringify(state);
    var name = "pushups-backup-" + todayKey + ".json";
    try {
      var file = new File([json], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: "Pushups backup" }).catch(function () {});
        return;
      }
    } catch (e) {}
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast("Backup isn't available here"); }
  });
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function () {
    var f = this.files && this.files[0]; this.value = "";
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || typeof d.days !== "object") throw 0;
        var merged = 0;
        for (var k in d.days) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(d.days[k])) continue;
          var l = d.days[k].filter(function (n) { return typeof n === "number" && n > 0 && n <= 1000; });
          if (l.length && (!state.days[k] || total(k) < l.reduce(function (a, b) { return a + b; }, 0))) { state.days[k] = l; merged++; }
        }
        if (d.goal > 0) state.goal = d.goal;
        save(); render(); closeSheet(); toast("Restored " + merged + " day" + (merged === 1 ? "" : "s"));
      } catch (e) { toast("That file isn't a backup"); }
    };
    r.readAsText(f);
  });

  // ---------- wiring ----------
  var adds = document.querySelectorAll(".add");
  for (var i = 0; i < adds.length; i++) {
    adds[i].addEventListener("click", function () { add(+this.getAttribute("data-n")); });
  }
  undoBtn.addEventListener("click", undo);
  document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  // New day? Re-check whenever the app comes back or a minute passes.
  function checkDay() {
    var k = keyFor(new Date());
    if (k !== todayKey) { todayKey = k; state = load(); render(); }
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { state = load(); checkDay(); render(); } });
  window.addEventListener("focus", checkDay);
  window.addEventListener("pageshow", function () { state = load(); checkDay(); render(); });
  setInterval(checkDay, 30000);

  // Manifest with an absolute start URL, so installs open this page standalone.
  try {
    var here = location.href.split("#")[0].split("?")[0];
    var manifest = {
      name: "Pushups", short_name: "Pushups", display: "standalone",
      start_url: here, scope: here.replace(/[^\/]*$/, ""),
      background_color: "#0f172a", theme_color: "#0f172a",
      icons: [{ src: document.querySelector('link[rel="apple-touch-icon"]').href, sizes: "180x180", type: "image/png" }]
    };
    if (/^https?:/.test(here)) {
      var link = document.createElement("link");
      link.rel = "manifest";
      link.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(link);
    }
  } catch (e) {}

  // Offline: only possible over HTTPS (or localhost). Needs pushup-sw.js next to this file.
  try {
    if ("serviceWorker" in navigator && window.isSecureContext && /^https?:/.test(location.protocol)) {
      navigator.serviceWorker.register("pushup-sw.js").then(function () {
        if (window.caches) caches.open("pushups-v2").then(function (c) { c.add(location.href.split("#")[0]); }).catch(function () {});
      }).catch(function () {});
    }
  } catch (e) {}

  render();
})();
</script>
</body>
</html>
